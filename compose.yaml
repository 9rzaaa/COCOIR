name: silver-atelier

services:
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    init: true
    volumes:
      - ./backend:/var/www/html:cached
      - /var/www/html/vendor
    environment:
      CI_ENVIRONMENT: development
      COURIER_API_URL: http://courier:8095/api/v1
      COURIER_API_KEY: ck_live_cocoexpress_2026_secret_token
      COURIER_WEBHOOK_SECRET: whsec_cocoexpress_courier_hmac_2026
      PAYMONGO_WEBHOOK_SECRET: whsec_cocoir_paymongo_hmac_secret_2026
    depends_on:
      mysql:
        condition: service_healthy
      courier:
        condition: service_started
    # Compose Watch: sync source; rebuild on dependency updates
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /var/www/html
        - action: rebuild
          path: ./backend/composer.json
        - action: rebuild
          path: ./backend/composer.lock

  nginx:
    image: nginx:alpine
    init: true
    ports:
      - "8090:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    # Compose Watch: sync site files and reload on config change
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /var/www/html
        - action: sync+restart
          path: ./backend/nginx.conf
          target: /etc/nginx/conf.d/default.conf

  mysql:
    image: mysql:8.0
    ports:
      - "3390:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: silver_atelier
      MYSQL_USER: silver
      MYSQL_PASSWORD: silver
    command: [ "--default-authentication-plugin=mysql_native_password" ]
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - silver_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8092:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  courier:
    build:
      context: ./courier-service
      dockerfile: Dockerfile
    init: true
    ports:
      - "8095:8095"
    environment:
      COURIER_API_KEY: ck_live_cocoexpress_2026_secret_token
      COURIER_WEBHOOK_SECRET: whsec_cocoexpress_courier_hmac_2026
    volumes:
      - ./courier-service:/srv/courier:cached

volumes:
  silver_mysql_data: